# CI/CD for Bath Solution Studio.
#   Pull request  -> tests only.
#   Push to main  -> tests, build the Docker image, push it to ECR, deploy it to the EC2 server
#                    through AWS Systems Manager (no SSH), check the public health endpoint.
#   Run workflow  -> manual deploy; give "image_tag" to redeploy an existing image (rollback).
# AWS access uses GitHub OIDC (no stored AWS keys). Setup: see deploy/README.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy instead of building (e.g. 3f2a9c1). Leave empty to build main."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Sample price-list PDFs are not in git, so their reader tests skip here; run them locally before pushing reader changes.
      - run: python -m pytest -q
      - name: Lint deploy scripts
        run: shellcheck -S warning deploy/*.sh

  deploy:
    needs: test
    # Skipped (tests still run) until the AWS variables are set up, so pushes before go-live stay green.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production          # add required reviewers on this environment to gate deploys
    concurrency:
      group: production-deploy
      cancel-in-progress: false      # never stop a deploy halfway; the next one queues
    permissions:
      id-token: write                # GitHub OIDC -> AWS role
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        run: |
          for v in AWS_REGION ECR_REPOSITORY ARTIFACT_BUCKET INSTANCE_ID APP_URL; do
            [ -n "${!v}" ] || { echo "::error::Repository variable for $v is not set (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          done

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pick image tag
        id: tag
        env:
          REQUESTED: ${{ github.event.inputs.image_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [ -n "$REQUESTED" ]; then
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$REQUESTED" >/dev/null \
              || { echo "::error::Image tag $REQUESTED is not in $ECR_REPOSITORY"; exit 1; }
            TAG="$REQUESTED"; BUILD=false
          else
            TAG="${GITHUB_SHA::7}"; BUILD=true
            # Re-running a deploy for the same commit reuses its image (ECR tags are immutable).
            if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then BUILD=false; fi
          fi
          { echo "tag=$TAG"; echo "build=$BUILD"; echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG"; } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.tag.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker build --pull --build-arg BSS_VERSION="$TAG" --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Upload server files (compose, Caddyfile, scripts)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: aws s3 cp --recursive --only-show-errors deploy/ "s3://$ARTIFACT_BUCKET/releases/$TAG/"

      - name: Deploy on the server (Systems Manager)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          jq -n --arg b "$ARTIFACT_BUCKET" --arg t "$TAG" --arg i "$IMAGE" --arg r "$AWS_REGION" '{commands: [
            "set -euo pipefail",
            "aws s3 cp --recursive --only-show-errors --region \($r) s3://\($b)/releases/\($t)/ /srv/bath-studio/",
            "chmod 755 /srv/bath-studio/*.sh",
            "/srv/bath-studio/deploy.sh \($i)"
          ], executionTimeout: ["900"]}' > params.json
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "bath-studio deploy $TAG by $GITHUB_ACTOR" --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command $CMD_ID"
          for _ in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Result: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "::error::Deploy failed on the server ($STATUS). If the new version was unhealthy, the server has already rolled back."; exit 1; }

      - name: Check the live site
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for _ in $(seq 1 12); do
            BODY=$(curl -fsS --max-time 10 "$APP_URL/healthz" || true)
            echo "$BODY" | grep -q "\"version\":\"$TAG\"" && { echo "Live: $BODY"; exit 0; }
            sleep 5
          done
          echo "::error::$APP_URL/healthz does not report version $TAG (got: ${BODY:-no answer})"; exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Deploy ${{ steps.tag.outputs.tag }} - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.tag.outputs.image }}\`  ·  Site: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
